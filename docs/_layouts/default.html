<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">Technical BA <span>/ Product Portfolio</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="https://github.com/Jenbn/technical-ba-platform-portfolio">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="container page-content">
    {{ content }}
  </main>
  <footer class="container footer">A learning and professional portfolio · <a href="https://github.com/Jenbn/technical-ba-platform-portfolio">View source on GitHub</a></footer>
</body>
</html>
